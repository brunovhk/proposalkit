services:
  app:
    image: proposalkit-app:production
    build:
      context: .
      dockerfile: docker/common/php-fpm/Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - public-assets:/var/www/html/public
      - storage-production:/var/www/html/storage
    networks:
      - proposalkit-prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/common/php-fpm/Dockerfile
      target: web-production
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - public-assets:/var/www/html/public:ro
      - storage-production:/var/www/html/storage:ro
    networks:
      - proposalkit-prod
    depends_on:
      app:
        condition: service_started

  queue:
    image: proposalkit-app:production
    build:
      context: .
      dockerfile: docker/common/php-fpm/Dockerfile
      target: production
    restart: unless-stopped
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    env_file:
      - .env
    volumes:
      - storage-production:/var/www/html/storage
    networks:
      - proposalkit-prod
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-prod-data:/var/lib/mysql
    networks:
      - proposalkit-prod
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-prod-data:/data
    networks:
      - proposalkit-prod
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  proposalkit-prod:

volumes:
  mysql-prod-data:
  redis-prod-data:
  public-assets:
  storage-production:
